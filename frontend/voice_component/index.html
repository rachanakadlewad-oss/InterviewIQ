<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
 body{font-family:"Inter","Segoe UI",system-ui,sans-serif;margin:0;padding:4px 0;color:#F5F7FB;background:transparent}
 button{padding:9px 16px;border:1px solid #26344B;border-radius:8px;background:#172033;color:#F5F7FB;font-size:14px;font-weight:550;cursor:pointer;margin-right:8px;transition:background .15s,border-color .15s}
 button:hover{border-color:#4094FF;background:#1B2842}
 button:focus-visible{outline:2px solid #4094FF;outline-offset:2px}
 button#rec{background:#1677FF;border-color:#1677FF}button#rec:hover{background:#4094FF;border-color:#4094FF}
 button.stop{background:#EF4444!important;border-color:#EF4444!important}
 #t{margin-top:10px;padding:10px 12px;background:#0E1626;border:1px solid #26344B;border-radius:8px;min-height:22px;font-size:14px;color:#AAB8CC}
 #s{font-size:12px;color:#8290A5;margin-top:6px}
</style></head><body>
<div><button id="speak">Replay question</button><button id="rec">Answer by voice</button></div>
<div id="t"></div><div id="s"></div>
<script>
// Minimal Streamlit bidirectional component (no build step). Speech-to-text and text-to-speech are done by the
// BROWSER (Web Speech API): STT works in Chrome/Edge only; TTS in all major browsers. Text input is the fallback.
const send = (type, data) => window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, data), "*");
const $ = id => document.getElementById(id);
let question = "", nonce = "", rec = null, listening = false, lastSpoken = "";
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function setHeight(){ send("streamlit:setFrameHeight", {height: 110}); }
function speak(){
  if(!("speechSynthesis" in window) || !question){ $("s").textContent = "Text-to-speech unavailable - read the question above."; return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(question); u.rate = 0.97; speechSynthesis.speak(u);
}
function startRec(){
  if(!SR){ $("s").textContent = "Speech recognition is not supported in this browser (use Chrome or Edge) - type your answer below."; return; }
  speechSynthesis.cancel();
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true;
  let finalText = "";
  rec.onresult = e => { let interim = ""; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finalText += r[0].transcript + " "; else interim += r[0].transcript; } $("t").textContent = finalText + interim; };
  rec.onerror = e => { $("s").textContent = "Mic error: " + e.error + " (allow microphone access, or type your answer)."; stopUI(); };
  rec.onend = () => { if(listening){ listening=false; stopUI(); if(finalText.trim()) send("streamlit:setComponentValue", {value:{transcript: finalText.trim(), ts: Date.now()}, dataType:"json"}); } };
  rec.start(); listening = true; $("rec").textContent = "Stop and use answer"; $("rec").className = "stop"; $("s").textContent = "Listening...";
}
function stopUI(){ $("rec").textContent = "Answer by voice"; $("rec").className = ""; }
$("rec").onclick = () => { if(listening){ rec.stop(); } else { startRec(); } };
$("speak").onclick = speak;
window.addEventListener("message", ev => {
  if(ev.data.type !== "streamlit:render") return;
  const a = ev.data.args; question = a.question || "";
  if(a.nonce !== nonce){ nonce = a.nonce; $("t").textContent = ""; if(a.autospeak) speak(); }   // speak each new question once
  setHeight();
});
send("streamlit:componentReady", {apiVersion:1}); setHeight();
</script></body></html>
